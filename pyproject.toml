[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "gcolab"
version = "0.3.0"
description = "Cross-platform CLI and Agent Skill for Google Cloud Compute Engine CPU/GPU sessions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "google-auth>=2.28.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
gcolab = "gcolab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcolab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
