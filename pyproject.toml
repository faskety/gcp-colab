[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "gcolab"
version = "0.2.1"
description = "Native Windows Colab-like CLI & SkyPilot-style orchestrator for Google Cloud Compute Engine (CPU/GPU/Spot)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "google-auth>=2.28.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
gcolab = "gcolab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcolab"]

[tool.hatch.build.targets.wheel.force-include]
"skills/gcp-colab-operator/SKILL.md" = "gcolab/bundled_skill.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
